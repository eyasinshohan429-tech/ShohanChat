<script>
  // এটি পেজের ওপর নজর রাখবে এবং Netlify badge আসামাত্রই সেটা রিমूव করে দেবে
  const observer = new MutationObserver((mutations, obs) => {
    const badge = document.getElementById('netlify-badge') || document.querySelector('iframe[src*="netlify"]');
    if (badge) {
      badge.remove(); // ব্যাজটি একদম ডিলিট করে দেবে
      obs.disconnect(); // কাজ শেষ হলে নজরদারি বন্ধ করে দেবে
    }
  });
  observer.observe(document.documentElement, {
    childList: true,
    subtree: true
  });
</script></head>
